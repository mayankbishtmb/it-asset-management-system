services:
  - type: web
    name: it-asset-management-system
    runtime: node
    plan: starter
    region: singapore
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: DB_FILE
        value: /var/data/itam.db
    disk:
      name: itam-data
      mountPath: /var/data
      sizeGB: 1
